    time: 2009 - 2013

experiences:
  title: Work Experience
  info:
  - role: Talent Partner, Go-to-Market
    time: 2026 - Present
    company: Rundoo
    details: |
      Building the Chicago-based GTM team at Rundoo. Hard at working hiring Account Executives, Sales Development Representatives, Implementation managers, and more! 

  - role: People Operations Lead
    time: 2021 - 2026
    company: Logiwa
    details: |
      - Owned recruiting analytics and ATS (Greenhouse) data integrity for USA and Turkey recruiters, and ran enablement sessions for recruiter continuing education.
      - Acted as a consultative People Partner for all US hiring managers, designing structured interview processes, advising on market compensation, and mitigating hiring bias.
      - Spearheaded full-cycle recruiting and sourcing for all North American functions, achieving 50+ critical hires across 10+ diverse departments (e.g., Sales, Product, Engineering, Finance), spanning roles from entry-level to VP.
      - Launched company’s first Diversity, Equity, & Inclusion committee, including presenting business case to executive leadership. Conducted company-wide sentiment and demographic survey, and analyzed quantitative and qualitative results using Excel & Google Sheets to drive data-driven goal setting. 
      - Organized company-wide social and educational events focused on DEI and belonging. Facilitated cultural exchange opportunities like English language practice for international team.
      - Ran new hire onboarding sessions and created project plans to redesign onboarding process for consistency across teams, including writing scripts for video intros from leadership. 
      - Developed and presented training sessions for global employee audience on topics including: recruiting best practices, leadership development, unconscious bias, and communication across cultural differences.
      - Served as interim head of USA People function for 3 months during search for new SVP.

  - role: Senior Recruiter
    time: Jan 2021 - Nov 2021
    company: ThoughtWorks
    details: |
      - Consistently met or exceeded goal of 2 hires/month, hiring Agile Product Managers and Senior Developers (various tech stacks) for consulting project teams.
      - Collaborated with US Immigration Team to define best practices for recruiters hiring candidates who need immigration support, and documented processes and FAQ guide in Trello. 
      - Created and delivered training sessions for ThoughtWorks’ first class of interns on interview preparation and resume and LinkedIn profile writing.

  - role: Talent Acquisition Specialist
    time: 2019-2021
    company: BenchPrep
    details: |
      - Key contributor to 230% company growth, managing full-cycle recruiting to scale the organization from 40 to 132 employees.
      - Conducted full cycle recruiting process from working with hiring managers to define job requirements, writing job postings, conducting phone interviews, designing and managing interview processes, and extending and negotiating job offers.
      - Filled open roles on Engineering, Product, Instructional Design, Customer Support, Customer Success, Finance, and Sales teams, ranging from entry level to senior managers.
      - Facilitated internal trainings for managers on interviewing, delivering feedback, and change management.
      - Using Confluence, created guides for company intranet on topics including : mental health support during COVID-19 pandemic, interviewing, and interview debrief best practices.


  - role: Research & Sourcing Specialist
    time: 2017-2019
    company: Objective Partners
    details: |
      Sourced and engaged passive candidates for clients’ open roles. Contracted as extension of client companies’ internal recruiting teams as part of agency’s new “candidate sourcing as service” offering. Supported high-bar pre-IPO startups, Fortune 500 enterprises, and other B2B SaaS businesses. Used Boolean search strings, browser extensions, talent aggregator software, social media, and networking to find and engage talent outside of LinkedIn and active applicant pool.
      Served on committee to design new employee training curriculum and created training materials using Camtasia video editing software and Cornerstone Learning Management System. 

