career-profile:
  title: Summary
  summary: |
    Strategic and data-driven People and Recruiting Operations professional with in-depth hands-on Talent Acquisition experience at high-growth B2B SaaS startups and technology companies.  Proven success  building hiring and onboarding systems, and scaling GTM, technical, and corporate teams across all business levels. Skilled in driving diversity initiatives, and partnering with leadership to build high-performing, inclusive teams that support organizational goals.
